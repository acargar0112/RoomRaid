<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}RoomRaid{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" >
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">RoomRaid</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/spaces/">Espacios</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/timeslots/">Franjas</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/rates/">Tarifas</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/bookings/">Reservas</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/occupancy/">Ocupación</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/stats/">Estadísticas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block contenido %}
        {% endblock %}
    </div>

    <footer class="text-center mt-5 mb-3 text-muted">
        <p>© 2026 RoomRaid — Coworking Scheduler</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
